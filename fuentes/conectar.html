@media (max-width:640px){#conectar .cn-conn{grid-template-columns:1fr}#conectar .cn-acts .cn-b{flex:1 1 100%}}

<script>
/* Conectar datos: trae clientes y lotes de cualquier Excel, CSV, Google Sheets u otro sistema.
   Reconoce las columnas solo, muestra la vista previa, no duplica y se puede deshacer. Diseño y desarrollo: Pedrojose Andrade Paredes */
(() => {
  if (typeof CLIENTS === "undefined" || typeof INV === "undefined") return;
  const E = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const N = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const say = t => (typeof toast === "function" ? toast(t) : alert(t));
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const CK = "vivaldi-conexiones-v1";
  const conns = () => { try { return JSON.parse(localStorage.getItem(CK) || "[]"); } catch (e) { return []; } };
  const saveConns = a => { try { localStorage.setItem(CK, JSON.stringify(a)); } catch (e) {} };

  // ---------- campos que la herramienta entiende y cómo suelen llamarse en otros sistemas ----------
  const F = {
    clientes: [
      ["name", "Nombre", ["nombre", "nombres", "nombre completo", "nombres y apellidos", "cliente", "contacto", "prospecto", "lead", "full name", "name", "razon social", "interesado"]],
      ["last", "Apellidos", ["apellido", "apellidos", "apellido paterno", "last name", "surname"]],
      ["phone", "Celular", ["celular", "telefono", "tel", "movil", "whatsapp", "phone", "mobile", "cel", "numero", "telefono celular", "nro celular", "contacto telefonico"]],
      ["dni", "DNI / CE", ["dni", "documento", "doc", "nro documento", "numero documento", "ce", "carnet", "ruc", "documento identidad"]],
      ["email", "Correo", ["correo", "email", "e mail", "mail", "correo electronico"]],
      ["proj", "Proyecto", ["proyecto", "condominio", "project", "producto", "inmueble", "proyecto interes", "interes"]],
      ["stage", "Etapa", ["etapa", "estado", "status", "fase", "stage", "pipeline", "estado lead", "situacion"]],
      ["src", "Origen", ["origen", "fuente", "canal", "source", "medio", "campana", "utm source", "como nos conocio", "lead source"]],
      ["adv", "Asesor", ["asesor", "vendedor", "agente", "ejecutivo", "responsable", "owner", "asesor asignado", "ejecutivo comercial"]],
      ["next", "Próximo contacto", ["proximo contacto", "seguimiento", "fecha seguimiento", "proxima llamada", "recordatorio", "next", "fecha proximo contacto"]],
      ["created", "Fecha de registro", ["fecha", "fecha registro", "fecha de registro", "creado", "created", "fecha ingreso", "alta", "fecha creacion", "created at", "registro"]],
      ["budget", "Presupuesto", ["presupuesto", "monto", "budget", "inversion", "monto estimado"]],
      ["notes", "Notas", ["notas", "nota", "observaciones", "observacion", "comentario", "comentarios", "detalle", "mensaje"]]
    ],
    lotes: [
      ["proj", "Proyecto", ["proyecto", "condominio", "project", "etapa proyecto"]],
      ["mz", "Manzana", ["manzana", "mz", "mza", "bloque", "mz."]],
      ["lt", "Lote", ["lote", "lt", "nro lote", "numero lote", "n lote", "unidad", "lote n"]],
      ["area", "Área m²", ["area", "area m2", "m2", "metraje", "superficie", "tamano", "area total", "medida m2"]],
      ["price", "Precio", ["precio", "precio lista", "precio de lista", "precio venta", "valor", "price", "precio s"]],
      ["st", "Estado", ["estado", "status", "disponibilidad", "situacion"]],
      ["loc", "Ubicación", ["ubicacion", "tipo", "frente", "posicion", "ubicacion lote", "vista"]],
      ["client", "Cliente", ["cliente", "propietario", "comprador", "titular"]]
    ]
  };
  const ETAPA = [[/descart|perdid|no interes|baja|lost|cancel/, "Descartado"], [/vendid|cerrad|ganad|won|compr|firm|contrato/, "Vendido"], [/separ|reserv|apart/, "Separado"],
    [/visit|cita|agend/, "Visita agendada"], [/contact|llamad|seguim|calif|negoci|propuest|cotiz/, "Contactado"], [/nuev|lead|prospect|new|ingres|pendient|interesad/, "Nuevo"]];
  const ESTADO = [[/vendid|sold|cerrad/, "Vendido"], [/separ|reserv|apart|hold/, "Separado"], [/bloque|no disp|retir|block/, "Bloqueado"], [/dispon|libre|avail|venta|activo/, "Disponible"]];
  const RANK = {Nuevo: 0, Contactado: 1, "Visita agendada": 2, Separado: 3, Vendido: 4, Descartado: -1};
  const pick = (v, T) => { const n = N(v); if (!n) return ""; const r = T.find(([re]) => re.test(n)); return r ? r[1] : ""; };
  const digits = v => String(v ?? "").replace(/\D/g, "");
  const phoneKey = v => { const d = digits(v); return d.length >= 9 ? d.slice(-9) : ""; };
  const num = v => { if (typeof v === "number") return v; let s = String(v ?? "").replace(/[^\d.,-]/g, ""); if (/,\d{1,2}$/.test(s) && !/\.\d{1,2}$/.test(s)) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(/,/g, ""); return +s || 0; };
  const fecha = v => { if (!v) return ""; if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10); if (typeof v === "number" && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
    const s = String(v).trim(); let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; } return ""; };
  const projOf = v => { const n = N(v); if (!n) return ""; const strip = x => N(x).replace(/^(la|las|el|los) /, "");
    const hit = VIV.find(p => N(p.name) === n) || VIV.find(p => n.includes(strip(p.name)) || strip(p.name).includes(n)) || VIV.find(p => strip(p.name).split(" ")[0] === n.split(" ").filter(w => !["la", "las", "el", "los"].includes(w))[0]);
    return hit ? hit.name : ""; };

  // ---------- lectura de archivos: CSV (cualquier separador y codificación) y Excel ----------
  function parseCSV(text) {
    text = text.replace(/^﻿/, ""); const first = text.split(/\r?\n/).find(l => l.trim()) || "";
    const sep = [";", "\t", ",", "|"].map(c => [c, first.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) { const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true; else if (ch === sep) { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch; }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(c => String(c).trim())); }
  async function readFile(f) {
    const buf = await f.arrayBuffer();
    if (/\.xlsx$/i.test(f.name)) { const wb = new ExcelJS.Workbook(); await wb.xlsx.load(buf);
      const ws = wb.worksheets.find(w => w.actualRowCount > 1) || wb.worksheets[0], rows = [];
      ws.eachRow({includeEmpty: false}, r => { const a = []; r.eachCell({includeEmpty: true}, (c, i) => { let v = c.value; if (v && typeof v === "object" && !(v instanceof Date)) v = v.result ?? v.text ?? (v.richText ? v.richText.map(x => x.text).join("") : c.text); a[i - 1] = v ?? ""; }); rows.push(Array.from(a, x => x ?? "")); });
      return rows; }
    if (/\.xls$/i.test(f.name)) throw new Error("El formato .xls antiguo no se puede leer: ábrelo en Excel y guárdalo como .xlsx o .csv");
    let t = new TextDecoder("utf-8").decode(buf); if (t.includes("�")) t = new TextDecoder("windows-1252").decode(buf);
    return parseCSV(t); }

  // ---------- reconocer columnas ----------
  function headerRow(rows) { for (let i = 0; i < Math.min(rows.length, 10); i++) { const r = rows[i]; if (r.filter(c => String(c).trim() && isNaN(+c)).length >= 2) return i; } return 0; }
  function autoMap(heads, type) { const used = new Set(), map = heads.map(() => ""), hn = heads.map(N);
    for (const pass of [0, 1]) F[type].forEach(([k, , syn]) => { if (used.has(k)) return;
      const i = hn.findIndex((h, j) => !map[j] && h && (pass === 0 ? syn.includes(h) : syn.some(s => s.length > 2 && (h.startsWith(s + " ") || h.endsWith(" " + s) || h === s)))); if (i >= 0) { map[i] = k; used.add(k); } });
    return map; }
  const detect = heads => { const c = autoMap(heads, "clientes").filter(Boolean), l = autoMap(heads, "lotes").filter(Boolean);
    return l.includes("mz") && l.includes("lt") ? "lotes" : c.length >= l.length ? "clientes" : "lotes"; };

  // ---------- convertir filas y comparar con lo que ya hay ----------
  function build(st) { const {rows, map, type} = st, out = [];
    rows.forEach(r => { const g = k => { const i = map.indexOf(k); return i < 0 ? "" : r[i]; }, t = k => String(g(k) ?? "").trim();
      if (type === "clientes") { const name = [t("name"), t("last")].filter(Boolean).join(" ").replace(/\s+/g, " "), phone = t("phone"), pk = phoneKey(phone), dni = digits(t("dni")).length >= 8 ? t("dni").toUpperCase().replace(/\s/g, "") : "";
        const pd = digits(phone), o = {name, phone: /^9\d{8}$/.test(pd) ? pd : /^519\d{8}$/.test(pd) ? pd.slice(2) : phone, dni, email: /@/.test(t("email")) ? t("email").toLowerCase() : "", proj: projOf(t("proj")) || t("proj"), stage: pick(t("stage"), ETAPA) || "", src: t("src"), adv: t("adv"), next: fecha(g("next")), created: fecha(g("created")), budget: num(g("budget")), notes: t("notes")};
        let why = !name && !pk ? "Sin nombre ni celular" : !name ? "Sin nombre" : "";
        const ex = why ? null : CLIENTS.find(c => (pk && phoneKey(c.phone) === pk) || (dni && c.dni && c.dni === dni)) || null;
        const dupIn = !why && out.some(x => x.o && x.ok && ((pk && phoneKey(x.o.phone) === pk) || (dni && x.o.dni === dni)));
        if (dupIn) why = "Repetido en el archivo";
        out.push({o, ok: !why, why, ex: why ? null : ex}); }
      else { const proj = t("proj") ? projOf(t("proj")) : st.proj, mz = String(t("mz")).replace(/^(mz|manzana)\.?\s*/i, "").toUpperCase(), lt = String(t("lt")).replace(/^(lt|lote)\.?\s*/i, "");
        const o = {proj, mz, lt, area: num(g("area")) || undefined, price: num(g("price")) || undefined, st: pick(t("st"), ESTADO) || undefined, loc: t("loc") || undefined, client: t("client") || undefined};
        let why = !mz || !lt ? "Sin manzana o lote" : !proj ? "Proyecto no reconocido" : "";
        const dupIn = !why && out.some(x => x.ok && x.o.proj === proj && x.o.mz === mz && N(x.o.lt) === N(lt)); if (dupIn) why = "Repetido en el archivo";
        out.push({o, ok: !why, why, ex: why ? null : findLot(proj, mz, lt)}); } });
    return out; }

  function apply(st, list) {
    const snap = {CLIENTS: JSON.stringify(CLIENTS), INV: JSON.stringify(INV)}; let add = 0, upd = 0;
    list.filter(x => x.ok).forEach(({o, ex}) => {
      if (st.type === "clientes") { const extra = [o.dni && "DNI " + o.dni, o.email].filter(Boolean).join(" · ");
        if (ex) { let ch = 0; ["phone", "dni", "email", "proj", "src", "adv", "next", "budget"].forEach(k => { if (o[k] && !ex[k]) { ex[k] = o[k]; ch++; } });
          if (o.stage && (RANK[o.stage] ?? 0) > (RANK[ex.stage] ?? 0)) { ex.stage = o.stage; ex.stageAt = today(); ch++; }
          if (o.notes && !String(ex.notes || "").includes(o.notes)) { ex.notes = [ex.notes, o.notes].filter(Boolean).join("\n"); ch++; }
          if (ch) { ex.hist = (ex.hist || []).concat([{d: today(), t: "Datos completados desde " + st.from}]).slice(-200); upd++; } }
        else { const d = o.created || today();
          CLIENTS.unshift({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), created: d, stageAt: d, ts: Date.parse(d + "T12:00") || Date.now(), name: o.name, phone: o.phone, dni: o.dni || undefined, email: o.email || undefined,
            proj: o.proj || (VIV[0] || {}).name || "", stage: o.stage || "Nuevo", next: o.next || "", budget: o.budget || 0, src: o.src || st.from, adv: o.adv || undefined,
            notes: [o.notes, extra].filter(Boolean).join("\n"), hist: [{d: today(), t: "Importado desde " + st.from}]}); add++; } }
      else { const clean = Object.fromEntries(Object.entries(o).filter(([, v]) => v !== undefined)), ex2 = findLot(o.proj, o.mz, o.lt);
        if (ex2 && Object.entries(clean).every(([k, v]) => String(ex2[k] ?? "") === String(v))) return; upsertLot(clean) ? add++ : upd++; } });
    if (st.type === "clientes") { crmSave(); typeof renderCrm === "function" && renderCrm(); } else { invSave(); typeof renderInv === "function" && renderInv(); }
    document.dispatchEvent(new CustomEvent("vivaldi:datos")); return {add, upd, snap}; }

  // ---------- pantalla ----------
  const sec = document.createElement("section"); sec.id = "conectar"; sec.setAttribute("aria-labelledby", "cnT");

  const EVS = [["solicitud", "Solicitudes de la web (consultas y separaciones)"], ["cliente_nuevo", "Clientes nuevos de la herramienta"], ["cliente_etapa", "Cambios de etapa"], ["lote_estado", "Lotes separados, vendidos o liberados"], ["venta", "Ventas registradas"]];
  const wfila = (w, demo) => `<div class="cn-c"><span class="ic" aria-hidden="true">→</span><div><b>${E(w.nombre)}${demo ? '<span class="cn-ej">Ejemplo</span>' : ""}</b><small>${E(w.url)}</small>
    <small>${(w.eventos || []).map(e => (EVS.find(x => x[0] === e) || [e, e])[1]).map(E).join(" · ")}${w.activo === false ? " · <b>en pausa</b>" : ""}</small>
    <small class="${/error/i.test(w.resultado || "") ? "err" : "okk"}">${E(w.resultado || "Aún sin envíos")}${+w.pendientes ? ` · ${w.pendientes} en cola` : ""}${+w.errores ? ` · ${w.errores} con error` : ""}</small></div>
    <div class="bt">${demo ? "" : `<button type="button" class="cn-b" data-wt="${w.id}">Enviar prueba</button><button type="button" class="cn-b" data-wp="${w.id}" data-on="${w.activo ? 1 : 0}">${w.activo ? "Pausar" : "Activar"}</button><button type="button" class="cn-b" data-wx="${w.id}">Quitar</button>`}</div></div>`;
  async function wlistar() { const b = $c("#cnWL"); if (!b) return; try { const l = await API("/rest/v1/rpc/webhooks_lista"); b.innerHTML = Array.isArray(l) && l.length ? l.map(w => wfila(w)).join("") : ""; } catch (e) { b.innerHTML = `<p class="cn-note" style="color:var(--bad)">${E(e.message)}</p>`; } }
  function wnuevo() { $c("#cnWN").innerHTML = `<div class="cn-f"><label>Nombre<input id="cnWNm" value="CRM de Vivaldi" maxlength="80"></label><label class="w">Dirección que recibe (https)<input id="cnWU" type="url" placeholder="https://hooks.zapier.com/… o la de su CRM" spellcheck="false"></label>
      <fieldset class="w" style="border:0;padding:0;margin:0"><legend style="font-weight:700;font-size:.86rem;margin-bottom:6px">Qué enviar</legend><div class="cn-src">${EVS.map(([k, l], i) => `<label style="display:flex;gap:8px;align-items:center;font-weight:600;font-size:.86rem"><input type="checkbox" data-ev="${k}"${i < 2 ? " checked" : ""}> ${E(l)}</label>`).join("")}</div></fieldset>
      <label>Firma (opcional)<input id="cnWS" placeholder="FIRMA_CRM" spellcheck="false"><small>Nombre del secreto con la clave para firmar cada envío</small></label></div><div class="cn-acts"><button type="button" class="cn-b pri" id="cnWGo">Guardar envío</button></div>`; }
  async function listar() { const b = $c("#cnCL"); if (!b) return; try { const l = await API("/rest/v1/rpc/conectores_lista"); b.innerHTML = (Array.isArray(l) && l.length) ? l.map(c => fila(c)).join("") : '<p class="cn-note">Aún no hay conectores. Crea el primero abajo.</p>'; } catch (e) { b.innerHTML = `<p class="cn-note" style="color:var(--bad)">${E(e.message)}</p>`; } }
  let CN = null;
  async function nuevo() { const b = $c("#cnNew"); let ases = []; try { ases = await window.vivaldiNube.api("/rest/v1/perfiles?select=id,nombre,rol&activo=eq.true", {method: "GET"}); } catch (e) {}
    b.innerHTML = `<h3>Nuevo conector</h3><div class="cn-f"><label>Sistema<select id="cnTipo">${GRUPOS.map(([g, o]) => `<optgroup label="${E(g)}">${Object.entries(o).map(([k, v]) => `<option value="${k}">${E(v)}</option>`).join("")}</optgroup>`).join("")}</select></label>
      <label>Qué trae<select id="cnK"><option value="clientes">Clientes</option><option value="lotes">Lotes (inventario)</option></select></label><label>Nombre<input id="cnNm" value="CRM de Vivaldi" maxlength="80"></label>
      <label>Cada cuánto<select id="cnMin"><option>5</option><option selected>15</option><option>30</option><option>60</option></select></label>
      <label>Asesor para los que no tengan uno<select id="cnAs">${(ases || []).map(a => `<option value="${E(a.id)}"${a.rol === "jefatura" ? " selected" : ""}>${E(a.nombre)}${a.rol === "jefatura" ? " (jefatura)" : ""}</option>`).join("")}</select></label>
      <div id="cnTf" style="display:contents"></div></div><div class="cn-acts"><button type="button" class="cn-b pri" id="cnProbar">Probar conexión</button></div><div id="cnPr"></div>`;
    campos(); }
  const CAMPOS = {hubspot: [["secreto", "Nombre del secreto con el token", "HUBSPOT_TOKEN", "Token de una app privada de HubSpot (permiso de lectura de contactos)"]], pipedrive: [["secreto", "Nombre del secreto con el token", "PIPEDRIVE_TOKEN", "Token personal de la API de Pipedrive"]],
    kommo: [["subdominio", "Subdominio de Kommo", "vivaldi", "Lo que va antes de .kommo.com"], ["secreto", "Nombre del secreto con el token", "KOMMO_TOKEN", "Token de larga duración de una integración privada"]],
    zoho: [["objeto", "Módulo", "Leads", "Leads o Contacts"], ["dominio", "Región de Zoho", "com", "com, eu, in, com.au…"], ["secreto", "Nombre del secreto con el token", "ZOHO_TOKEN", "Con ZOHO_REFRESH_TOKEN, ZOHO_CLIENT_ID y ZOHO_CLIENT_SECRET se renueva solo"]],
    api: [["url", "Dirección de la API", "https://", "La lista de clientes o lotes en JSON", 1], ["lista", "Ruta de la lista en la respuesta", "data", "Por ejemplo data o results"], ["secreto", "Nombre del secreto con la clave", "CRM_TOKEN", "Opcional"], ["encabezado", "Encabezado de la clave", "Authorization", ""], ["prefijo", "Antes de la clave", "Bearer ", ""], ["siguiente", "Ruta de la página siguiente", "", "Opcional, por ejemplo paging.next.link"], ["metodo", "Método", "GET", "GET o POST (POST para GraphQL)"], ["cuerpo", "Cuerpo del pedido (solo POST)", "", "Por ejemplo la consulta GraphQL en JSON", 1, 1]],
    salesforce: [["instancia", "Dirección de Salesforce", "https://vivaldi.my.salesforce.com", "La de su organización", 1], ["objeto", "Objeto", "Lead", "Lead o Contact"], ["secreto", "Nombre del secreto con el token", "SALESFORCE_TOKEN", "Token de acceso de una app conectada (solo lectura)"], ["soql", "Consulta SOQL (opcional)", "", "Si se deja vacía se leen nombre, celular, correo, estado, origen, propietario y fecha", 1, 1]],
    dynamics: [["organizacion", "Dirección de Dynamics 365", "https://vivaldi.crm2.dynamics.com", "La de su entorno", 1], ["objeto", "Tabla", "leads", "leads o contacts"], ["secreto", "Nombre del secreto con el token", "DYNAMICS_TOKEN", "Token de una aplicación registrada en Azure"]],
    bitrix24: [["objeto", "Qué leer", "contact", "contact o lead"], ["secreto", "Nombre del secreto con el webhook", "BITRIX_WEBHOOK", "La dirección del webhook entrante de Bitrix24 (https://…/rest/1/…/) se guarda como secreto"]],
    odoo: [["url", "Dirección de Odoo", "https://vivaldi.odoo.com", "", 1], ["bd", "Base de datos", "vivaldi", "Nombre de la base de Odoo"], ["usuario", "Usuario", "", "Correo del usuario de Odoo"], ["secreto", "Nombre del secreto con la clave", "ODOO_CLAVE", "Clave o clave de API del usuario"], ["modelo", "Modelo", "crm.lead", "crm.lead o res.partner"]],
    clientify: [["secreto", "Nombre del secreto con el token", "CLIENTIFY_TOKEN", "Token de la API de Clientify"]],
    sheets: [["url", "Enlace de la hoja", "https://docs.google.com/spreadsheets/d/…", "Publicada en la web como CSV o compartida con cualquier persona con el enlace", 1]],
    airtable: [["base_id", "Identificador de la base", "app…", "Empieza con app"], ["tabla", "Tabla", "Clientes", ""], ["secreto", "Nombre del secreto con el token", "AIRTABLE_TOKEN", "Token personal con permiso de lectura"]],
    csv: [["url", "Dirección del archivo CSV", "https://", "Cualquier exportación periódica en CSV", 1], ["secreto", "Nombre del secreto con la clave", "", "Opcional"]],
    sqlserver: [["secreto", "Nombre del secreto con la conexión", "BD_VIVALDI", "Server=servidor;Database=base;User Id=lectura;Password=…;Encrypt=true"], ["consulta", "Consulta (solo lectura)", "SELECT TOP 5000 * FROM Clientes", "Un SELECT; conviene un usuario de solo lectura", 1, 1]],
    postgres: [["secreto", "Nombre del secreto con la conexión", "BD_VIVALDI", "postgres://usuario_lectura:clave@servidor:5432/base"], ["consulta", "Consulta (solo lectura)", "select * from clientes", "Un SELECT; conviene un usuario de solo lectura", 1, 1]],
    mysql: [["secreto", "Nombre del secreto con la conexión", "BD_VIVALDI", "mysql://usuario_lectura:clave@servidor:3306/base"], ["consulta", "Consulta (solo lectura)", "select * from lotes", "Un SELECT; conviene un usuario de solo lectura", 1, 1]]};
  function campos() { const t = $c("#cnTipo").value; $c("#cnTf").innerHTML = CAMPOS[t].map(([k, l, ph, h, w, ta]) => `<label${w ? ' class="w"' : ""}>${E(l)}${ta ? `<textarea data-k="${k}" spellcheck="false">${E(ph)}</textarea>` : `<input data-k="${k}" value="${E(["secreto", "encabezado", "prefijo", "objeto", "dominio", "lista", "modelo", "metodo"].includes(k) ? ph : "")}" placeholder="${E(ph)}" spellcheck="false">`}${h ? `<small>${E(h)}</small>` : ""}</label>`).join(""); $c("#cnPr").innerHTML = ""; CN = null; }
  const cfgActual = () => { const c = {}; sec.querySelectorAll("#cnTf [data-k]").forEach(i => { if (i.value.trim()) c[i.dataset.k] = i.dataset.k === "prefijo" ? i.value.trim() + " " : i.value.trim(); }); c.asesor_defecto = $c("#cnAs").value || undefined; return c; };
  const CF = {clientes: [["ext", "Identificador en el CRM"], ...F.clientes.map(([k, l]) => [k, l])], lotes: F.lotes.map(([k, l]) => [k, l])};
  function verPrueba() { const r = CN.r, k = CN.k, fields = CF[k];
    $c("#cnPr").innerHTML = `<div class="cn-ok" role="status"><span>Conexión correcta: ${r.leidos} registros leídos en la prueba.</span></div>
      <h3 style="margin-top:16px">Cómo se entiende cada campo</h3><div class="cn-map">${fields.map(([f, l]) => `<div class="cn-col${CN.mapa[f] ? " on" : ""}"><b>${E(l)}</b><small>${CN.mapa[f] ? "desde «" + E(CN.mapa[f]) + "»" : "sin columna"}</small>
        <select data-cm="${f}" aria-label="Columna para ${E(l)}"><option value="">—</option>${r.columnas.map(c => `<option value="${E(c)}"${CN.mapa[f] === c ? " selected" : ""}>${E(c)}</option>`).join("")}</select></div>`).join("")}</div>
      <div class="cn-prev" tabindex="0" role="region" aria-label="Vista previa del conector"><table><thead><tr>${fields.filter(([f]) => f !== "last" && f !== "ext").map(([, l]) => `<th>${E(l)}</th>`).join("")}</tr></thead><tbody>${(r.filas || []).map(x => `<tr>${fields.filter(([f]) => f !== "last" && f !== "ext").map(([f]) => `<td>${E(x[f] ?? "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="cn-acts"><button type="button" class="cn-b gold" id="cnGuardarC">Guardar y sincronizar cada ${E($c("#cnMin").value)} min</button></div>`; }
  sec.addEventListener("change", e => { if (e.target.id === "cnTipo") campos(); if (e.target.dataset && e.target.dataset.cm && CN) { CN.mapa[e.target.dataset.cm] = e.target.value || undefined; } });
  sec.addEventListener("click", async e => { const b = e.target.closest("button"); if (!b || !jefe()) return;
    try {
      if (b.id === "cnProbar") { b.disabled = true; b.textContent = "Probando…"; const k = $c("#cnK").value, cfg = cfgActual();
        const r = await API("/functions/v1/conector", {accion: "probar", tipo: $c("#cnTipo").value, coleccion: k, config: cfg}); CN = {r, k, mapa: Object.assign({}, r.mapa)}; verPrueba(); }
      if (b.id === "cnGuardarC") { const cfg = Object.assign(cfgActual(), {mapa: Object.fromEntries(Object.entries(CN.mapa).filter(([, v]) => v))});
        const id = val(await API("/rest/v1/rpc/guardar_conector", {p: {nombre: $c("#cnNm").value.trim() || "Conector", tipo: $c("#cnTipo").value, coleccion: CN.k, cada_min: +$c("#cnMin").value, config: cfg}}));
        say("Conector guardado: sincronizando por primera vez…"); await API("/functions/v1/conector", {accion: "sincronizar", id}).catch(() => {}); await listar(); nuevo(); window.vivaldiNube.sync && window.vivaldiNube.sync(); }
      if (b.dataset.cs) { b.disabled = true; b.textContent = "Sincronizando…"; const r = await API("/functions/v1/conector", {accion: "sincronizar", id: +b.dataset.cs}); say(r.ok ? `Listo: ${r.nuevos} nuevos y ${r.actualizados} actualizados` : "Error: " + r.error); await listar(); window.vivaldiNube.sync && window.vivaldiNube.sync(); }
      if (b.dataset.cp) { await API("/rest/v1/rpc/guardar_conector", {p: {id: +b.dataset.cp, activo: b.dataset.on !== "1"}}); listar(); }
      if (b.dataset.cx && confirm("¿Quitar este conector? Los clientes y lotes ya traídos se quedan.")) { await API("/rest/v1/rpc/borrar_conector", {p_id: +b.dataset.cx}); listar(); }
      if (b.id === "cnWGo") { const url = $c("#cnWU").value.trim(), ev = [...sec.querySelectorAll("[data-ev]:checked")].map(x => x.dataset.ev);
        if (!/^(https:\/\/|http:\/\/127\.0\.0\.1[:/])/.test(url)) { $c("#cnWU").focus(); return say("La dirección debe empezar con https://"); } if (!ev.length) return say("Elige al menos un evento");
        await API("/rest/v1/rpc/guardar_webhook", {p: {nombre: $c("#cnWNm").value.trim() || "CRM de Vivaldi", url, eventos: ev, secreto: $c("#cnWS").value.trim().toUpperCase()}}); say("Envío guardado"); wlistar(); wnuevo(); }
      if (b.dataset.wt) { b.disabled = true; b.textContent = "Enviando…"; await API("/rest/v1/rpc/probar_webhook", {p_id: +b.dataset.wt}); const r = await API("/functions/v1/conector", {accion: "entregar"}); say(r.enviados ? "Prueba enviada correctamente" : "La prueba no se pudo entregar: revisa la dirección"); wlistar(); }
      if (b.dataset.wp) { await API("/rest/v1/rpc/guardar_webhook", {p: {id: +b.dataset.wp, activo: b.dataset.on !== "1"}}); wlistar(); }
      if (b.dataset.wx && confirm("¿Quitar este envío?")) { await API("/rest/v1/rpc/borrar_webhook", {p_id: +b.dataset.wx}); wlistar(); }
    } catch (err) { alert(err.message || String(err)); } finally { if (b.id === "cnProbar") { b.disabled = false; b.textContent = "Probar conexión"; } } });

  window.vivaldiConectar = {parseCSV, autoMap, detect, build: st => build(st), syncConn, crm};
})();
</script>
